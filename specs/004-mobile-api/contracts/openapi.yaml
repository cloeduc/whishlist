openapi: 3.1.0
info:
  title: Oh, You Shouldn't! API
  version: "1.7.0"
  description: |
    Accès aux listes pour un client autre que le site (app mobile, script).

    - Langue des messages : en-tête `Accept-Language` (`fr` par défaut, `en`).
    - Corps : JSON (`Content-Type: application/json`), 64 Ko au plus.
    - Toutes les réponses portent `Cache-Control: private, no-store`.
    - L'API n'utilise aucun cookie. Une demande venant d'un navigateur (en-tête `Origin`)
      n'est acceptée que depuis le site ou une origine de `API_ALLOWED_ORIGINS`.
    - Une version retirée répond `410` avec le code `apiVersionUnsupported`.
    - 1.1.0 : le client peut choisir l'identifiant de ce qu'il crée (`id` sur `POST /lists` et
      `POST /lists/{listId}/items`) ; un renvoi répond `200` sans rien créer. Champs facultatifs.
      `ListSummary` gagne `subtitle`, `coverImageUrl` et `theme` (carte de « Mes listes »).
    - 1.2.0 : suppression du compte (`GET`/`POST /me/deletion`), export de ses données
      (`GET /me/export`), `analytics` dans `/capabilities`.
    - 1.3.0 : validation de l'adresse e-mail. `Me` gagne `emailVerified`. Un compte non vérifié reçoit
      `emailNotVerified` (403) sur `POST /lists`, `POST /lists/{listId}/invitations` et
      `POST /invitations/{inviteToken}/accept`, et peut redemander le lien (`POST /me/email-verification`).
      Changement d'adresse : `POST /me/email`, annulation `DELETE /me/email`, `Me.pendingEmail`.
      La confirmation se fait sur le site (lien reçu par e-mail).
    - 1.4.0 : liens de l'app. Les liens envoyés par e-mail ou partagés ouvrent l'app quand elle est
      installée (chemins revendiqués : `specs/011-app-deep-links/contracts/links.md`), le site sinon.
      L'app finit elle-même l'action du lien : confirmation de l'adresse (`POST /auth/email-confirmation`),
      nouveau mot de passe (`POST /auth/password-reset/confirm`), aperçu d'une invitation
      (`GET /invitations/{inviteToken}`).
    - 1.5.0 : `secondHandOk` sur les idées (`PublicItem`, `MemberItem`, et facultatif dans `ItemInput`) ;
      `description` sur les idées (`PublicItem`, `MemberItem`, facultative dans `ItemInput`)
      et dans la réponse de `POST /lists/{listId}/enrich`.
    - 1.6.0 : déplacer ou copier une idée (`POST /lists/{listId}/items/{itemId}/move` et `/copy`).
    - 1.7.0 : abonnements aux listes publiques (`POST /subscriptions`, `DELETE /subscriptions/{readToken}`,
      `subscriptions` dans `GET /lists`, `subscribed` et `isMember` dans `PublicList`,
      `followedLists` dans `AccountDeletionPreview`).

    Preuves à garder côté client :
    - `token` (connexion) → `Authorization: Bearer <token>`, 30 jours.
    - `unlockToken` (liste protégée) → `X-Read-Unlock`, 14 jours.
    - `claim` (réservation sans compte) → `X-Reservation-Claims`, séparés par des virgules, 90 jours.
servers:
  - url: /api/v1

tags:
  - name: meta
  - name: public
    description: Sans compte, par le lien de lecture (User Story 1).
  - name: auth
    description: Connexion et compte (User Stories 2 et 6).
  - name: lists
    description: Listes du membre (User Stories 2 et 4).
  - name: items
    description: Idées (User Story 3).
  - name: labels
    description: Catégories et « qui » (User Story 4).
  - name: sharing
    description: Partage et membres (User Story 5).

security:
  - bearer: []

paths:
  /capabilities:
    get:
      tags: [meta]
      summary: Version et services optionnels configurés
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, enrich, mail, analytics]
                properties:
                  apiVersion: { type: string, example: "1.7.0" }
                  enrich:
                    type: boolean
                    description: Préremplissage depuis un lien avec IA (sinon seulement les métadonnées de la page).
                  mail: { type: boolean, description: Envoi d'e-mails configuré. }
                  analytics: { type: boolean, description: Mesure d'audience configurée sur le site. Depuis 1.2.0. }

  # ---------- Public (sans compte) ----------

  /public/lists/{readToken}:
    get:
      tags: [public]
      summary: Lire une liste par son lien
      description: |
        Même contenu que la page publique : idées libres, plus celles réservées par ce client
        (claims ou compte connecté), marquées `mine`. Un bearer optionnel compte comme
        membre (pas besoin d'unlock) et pour `mine`.
      security: [{}, { bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/readToken"
        - $ref: "#/components/parameters/readUnlock"
        - $ref: "#/components/parameters/reservationClaims"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicList" }
        "404": { $ref: "#/components/responses/Error" }
        "423":
          description: Mot de passe de lecture nécessaire (`readPasswordRequired`). Le corps contient aussi `title`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      title: { type: string }

  /public/lists/{readToken}/unlock:
    post:
      tags: [public]
      summary: Déverrouiller une liste protégée
      security: []
      parameters:
        - $ref: "#/components/parameters/readToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unlockToken, expiresAt]
                properties:
                  unlockToken: { type: [string, "null"], description: null si la liste n'a pas de mot de passe. }
                  expiresAt: { type: [string, "null"], format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /public/lists/{readToken}/reservations:
    post:
      tags: [public]
      summary: Réserver une idée
      description: Sans compte possible. Avec un bearer, la réservation est liée au compte.
      security: [{}, { bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/readToken"
        - $ref: "#/components/parameters/readUnlock"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: string }
                typeId: { type: string, description: Optionnel, vérifie que l'idée est dans cette catégorie. }
                fromName: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Réservée
          content:
            application/json:
              schema:
                type: object
                required: [reservationId, claim]
                properties:
                  reservationId: { type: string }
                  claim: { type: [string, "null"], description: À renvoyer dans `X-Reservation-Claims`. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          $ref: "#/components/responses/Error"
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /public/lists/{readToken}/reservations/{reservationId}:
    delete:
      tags: [public]
      summary: Annuler sa propre réservation
      description: Autorisé si la réservation est liée au compte connecté, ou si un claim valide est fourni.
      security: [{}, { bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/readToken"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/reservationClaims"
      responses:
        "204": { description: Annulée }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------- Auth et compte ----------

  /auth/register:
    post:
      tags: [auth]
      summary: Créer un compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                displayName: { type: string }
      responses:
        "201":
          description: Compte créé, client connecté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "202":
          description: E-mail déjà inscrit. Un e-mail est envoyé à cette adresse ; pas de connexion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: checkEmail }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Se connecter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Connecté. Si `user.mustChangePassword`, seules /me, /me/password et /auth/logout répondent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: E-mail ou mot de passe faux (`invalidCredentials`), sans dire lequel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Se déconnecter (le jeton ne vaut plus rien)
      responses:
        "204": { description: Déconnecté }
        "401": { $ref: "#/components/responses/Error" }

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Demander un lien de réinitialisation
      description: Même réponse que l'e-mail existe ou non. Le lien envoyé ouvre l'app si elle est installée, le site sinon.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: |
            Demande prise en compte. Sans e-mail configuré, le lien est écrit dans le journal du
            serveur, comme sur le site ; il n'est jamais rendu dans la réponse.
        "429": { $ref: "#/components/responses/Error" }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Choisir le nouveau mot de passe depuis le lien reçu
      description: |
        Comme la page `/reinitialiser/{token}` du site : le mot de passe change, l'adresse est marquée
        vérifiée et les autres connexions du compte tombent. Avec `signIn`, la réponse ouvre une session
        pour ce compte ; l'app l'envoie seulement si personne n'y est connecté. 20 essais par IP en 15 min.
        Depuis 1.4.0.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: Dernier segment du lien reçu. }
                password: { type: string }
                signIn: { type: boolean, default: false }
      responses:
        "200":
          description: Mot de passe changé
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    description: Rempli si `signIn` est vrai.
                    oneOf:
                      - $ref: "#/components/schemas/Session"
                      - type: "null"
        "400":
          description: "`passwordTooShort`, `resetLinkInvalid` (inconnu ou déjà utilisé) ou `resetLinkExpired`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/email-confirmation:
    post:
      tags: [auth]
      summary: Confirmer une adresse depuis le lien reçu
      description: |
        Comme le bouton de la page `/confirmer-email/{token}` du site : validation de l'adresse ou
        changement d'adresse, selon le lien. Le jeton porte toute l'autorisation ; un bearer, facultatif,
        sert seulement à `ownAccount`. Après un changement, l'ancienne adresse est prévenue.
        20 essais par IP en 15 min. Depuis 1.4.0.
      security: [{}, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Dernier segment du lien reçu. }
                suite: { type: string, description: Paramètre `suite` du lien, s'il y en a un. }
      responses:
        "200":
          description: Adresse confirmée
          content:
            application/json:
              schema:
                type: object
                required: [purpose, ownAccount, suite]
                properties:
                  purpose: { enum: [verify, change] }
                  ownAccount: { type: boolean, description: Le lien est celui du compte du bearer. }
                  suite:
                    type: [string, "null"]
                    description: Chemin interne du site où reprendre (`/inviter/…`), sinon null.
        "400":
          description: |
            `confirmationLinkInvalid` (inconnu, déjà utilisé, remplacé), `confirmationLinkExpired`, ou
            `emailTaken` (changement vers une adresse prise entre-temps).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /me:
    get:
      tags: [auth]
      summary: Compte connecté
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [auth]
      summary: Changer son nom affiché
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /me/email-verification:
    post:
      tags: [auth]
      summary: Renvoyer le lien de confirmation de l'adresse
      description: |
        Un nouveau lien part vers l'adresse du compte ; le précédent ne vaut plus rien. Le lien ouvre l'app si elle est installée, le site sinon.
        Depuis 1.3.0.
      responses:
        "202":
          description: Demande prise en compte. `sent` est faux si l'envoi a échoué (réessayer plus tard).
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Adresse déjà confirmée, ou validation non exigée sur ce serveur (`emailAlreadyVerified`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /me/email:
    post:
      tags: [auth]
      summary: Demander un changement d'adresse e-mail
      description: |
        Mot de passe actuel exigé. Avec l'envoi d'e-mail actif, un lien part vers la nouvelle adresse :
        `email` ne change pas encore et `pendingEmail` vaut la nouvelle adresse. Sans envoi d'e-mail,
        la nouvelle adresse s'applique tout de suite. Une nouvelle demande remplace la précédente. Le lien envoyé
        ouvre l'app si elle est installée, le site sinon. Depuis 1.3.0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, currentPassword]
              properties:
                email: { type: string, format: email }
                currentPassword: { type: string }
      responses:
        "200":
          description: Demande enregistrée (ou adresse changée sans envoi d'e-mail)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: |
            `emailInvalid`, `emailUnchanged` ou `wrongCurrentPassword` ; `emailTaken` seulement sans envoi
            d'e-mail. Avec l'envoi actif, l'adresse d'un autre compte reçoit la même réponse `200` qu'une
            adresse libre, pour ne pas révéler les comptes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Annuler le changement d'adresse en attente
      description: Le lien envoyé ne vaut plus rien. Sans demande en attente, ne fait rien. Depuis 1.3.0.
      responses:
        "200":
          description: Annulé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /me/password:
    post:
      tags: [auth]
      summary: Changer son mot de passe
      description: |
        Invalide toutes les autres connexions (site et appareils). Rend un nouveau jeton pour ce client.
        `currentPassword` n'est pas demandé si `mustChangePassword`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                currentPassword: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Changé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /me/deletion:
    get:
      tags: [auth]
      summary: Ce que supprimerait la suppression du compte
      description: Ne modifie rien. Depuis 1.2.0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionPreview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Supprimer son compte
      description: |
        Exige le mot de passe actuel. Supprime le compte, ses connexions (site et appareils),
        les listes dont il est le seul membre ; transmet les autres ; garde ses réservations
        sans lien au compte. Le jeton utilisé ne vaut plus rien ensuite. Depuis 1.2.0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Supprimé }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /me/export:
    get:
      tags: [auth]
      summary: Télécharger ses données
      description: Document JSON sans aucun secret, 5 demandes par heure. Depuis 1.2.0.
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="ohyoushouldnt-donnees-2026-10-28.json"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountExport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  # ---------- Listes ----------

  /lists:
    get:
      tags: [lists]
      summary: Mes listes et listes suivies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lists, subscriptions]
                properties:
                  lists:
                    type: array
                    items: { $ref: "#/components/schemas/ListSummary" }
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/SubscribedListSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [lists]
      summary: Créer une liste (avec sa première catégorie et son premier « qui »)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Aucun champ n'est obligatoire : un champ vide ou absent prend sa valeur par défaut, dans la langue
                de la requête (`Accept-Language`).
              properties:
                title:
                  type: string
                  description: >-
                    Nom de la liste. Vide ou absent : « Liste de <nom affiché> » / "<nom affiché>’s list" (« Ma
                    liste » / "My list" si le nom affiché est vide), suivi d'un numéro (« 2 », « 3 »…) si une liste
                    du compte porte déjà ce nom.
                category:
                  type: string
                  description: >-
                    Première catégorie. Une saisie séparée par des virgules en crée plusieurs ; `categoryId` ne vaut
                    que pour la première. Vide ou absente (ou faite seulement de virgules) : « Cadeaux » / "Gifts".
                person:
                  type: string
                  description: >-
                    Premier destinataire. Une saisie séparée par des virgules en crée plusieurs ; `personId` ne vaut
                    que pour le premier. Vide ou absent (ou fait seulement de virgules) : le nom affiché du compte,
                    tel quel (jamais découpé), ou « Moi » / "Me" s'il est vide.
                id: { $ref: "#/components/schemas/ClientId" }
                categoryId: { $ref: "#/components/schemas/ClientId" }
                personId: { $ref: "#/components/schemas/ClientId" }
      responses:
        "201":
          description: Créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "200":
          description: Renvoi — une liste avec cet `id` existe et le compte en est membre ; rien n'est créé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Identifiant déjà utilisé ailleurs (`idConflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/listId"
    get:
      tags: [lists]
      summary: Vue membre d'une liste
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [lists]
      summary: Réglages (titre, sous-titre, image, thème)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                subtitle: { type: string }
                coverImageUrl: { type: string }
                theme: { $ref: "#/components/schemas/Theme" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [lists]
      summary: Supprimer la liste (créateur seulement)
      responses:
        "204": { description: Supprimée }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------- Idées ----------

  /lists/{listId}/items:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [items]
      summary: Ajouter une idée
      description: Sans `imageUrl`, l'image est cherchée sur la page du lien, comme sur le site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ItemInput" }
                - type: object
                  properties:
                    id: { $ref: "#/components/schemas/ClientId" }
      responses:
        "201":
          description: Créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "200":
          description: Renvoi — une idée avec cet `id` existe dans cette liste ; rien n'est créé ni modifié.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: L'`id` est déjà utilisé ailleurs (`idConflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lists/{listId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/listId"
      - $ref: "#/components/parameters/itemId"
    put:
      tags: [items]
      summary: Modifier une idée (tous les champs)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [items]
      summary: Archiver, désarchiver ou changer de catégorie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                archived: { type: boolean }
                typeId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [items]
      summary: Supprimer une idée
      responses:
        "204": { description: Supprimée }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/items/{itemId}/move:
    parameters:
      - $ref: "#/components/parameters/listId"
      - $ref: "#/components/parameters/itemId"
    post:
      tags: [items]
      summary: Déplacer une idée vers une autre liste (depuis 1.5.0)
      description: |
        Il faut être membre des deux listes. L'idée garde son identifiant ; `typeId` et `personId`
        sont ceux de la liste d'arrivée. Une idée réservée ne change pas de liste
        (`itemReservedCannotMove`) : la personne qui a réservé ne peut annuler que depuis le lien de
        la liste d'origine. Un renvoi après réussite (même liste d'arrivée, même catégorie, même
        « qui ») rend l'idée déjà déplacée.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemTransfer" }
      responses:
        "200":
          description: L'idée, dans la liste d'arrivée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/items/{itemId}/copy:
    parameters:
      - $ref: "#/components/parameters/listId"
      - $ref: "#/components/parameters/itemId"
    post:
      tags: [items]
      summary: Copier une idée, dans la même liste ou une autre (depuis 1.5.0)
      description: |
        Il faut être membre des deux listes. Tous les champs de l'idée sont copiés, pas sa
        réservation. Dans la même liste, la copie se place juste après l'original. `id` : comme à
        la création, identifiant choisi par le client ; un renvoi répond `200` sans rien créer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ItemTransfer" }
                - type: object
                  properties:
                    id: { type: string, description: Identifiant de la copie choisi par le client. }
      responses:
        "201":
          description: Copie créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "200":
          description: Renvoi d'une copie déjà reçue (même `id`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/enrich:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [items]
      summary: Préremplir une idée depuis un lien produit (ne crée rien)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        "200":
          description: Champs proposés
          content:
            application/json:
              schema:
                type: object
                required: [name, price, imageUrl, typeId, description, usedLlm]
                properties:
                  name: { type: string }
                  price: { type: string, description: Prix saisi tel quel, à renvoyer dans ItemInput.price. }
                  imageUrl: { type: string }
                  typeId: { type: string }
                  description:
                    type: string
                    description: "Depuis 1.5.0. Quelques phrases sur le produit (300 caractères au plus), vide si rien trouvé. À proposer seulement si la description de l'idée est vide."
                  usedLlm: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422":
          description: Page illisible ou rien trouvé (`pageLoadFailed`, `enrichEmpty`, `enrichEmptyNoLlm`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }

  # ---------- Catégories et « qui » ----------

  /lists/{listId}/types:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [labels]
      summary: Ajouter une catégorie
      requestBody: { $ref: "#/components/requestBodies/Label" }
      responses:
        "201": { $ref: "#/components/responses/Label" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/types/order:
    parameters:
      - $ref: "#/components/parameters/listId"
    put:
      tags: [labels]
      summary: Réordonner les catégories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [typeIds]
              properties:
                typeIds: { type: array, items: { type: string } }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/types/{typeId}:
    parameters:
      - $ref: "#/components/parameters/listId"
      - { name: typeId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [labels]
      summary: Renommer une catégorie
      requestBody: { $ref: "#/components/requestBodies/Label" }
      responses:
        "200": { $ref: "#/components/responses/Label" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [labels]
      summary: Retirer une catégorie (refusé si des idées l'utilisent)
      responses:
        "204": { description: Retirée }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/people:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [labels]
      summary: Ajouter un « qui »
      requestBody: { $ref: "#/components/requestBodies/Label" }
      responses:
        "201": { $ref: "#/components/responses/Label" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/listId"
      - { name: personId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [labels]
      summary: Renommer un « qui »
      requestBody: { $ref: "#/components/requestBodies/Label" }
      responses:
        "200": { $ref: "#/components/responses/Label" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [labels]
      summary: Retirer un « qui » (refusé si des idées l'utilisent)
      responses:
        "204": { description: Retiré }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------- Partage ----------

  /lists/{listId}/reservations/{reservationId}:
    parameters:
      - $ref: "#/components/parameters/listId"
      - $ref: "#/components/parameters/reservationId"
    delete:
      tags: [sharing]
      summary: Annuler une réservation de sa liste (membre)
      responses:
        "204": { description: Annulée }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/invite-link:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [sharing]
      summary: Régénérer le lien d'invitation (l'ancien ne marche plus)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [inviteUrl, inviteToken]
                properties:
                  inviteUrl: { type: string }
                  inviteToken: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/invitations:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [sharing]
      summary: Inviter par e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Invitation envoyée }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: Adresse du compte pas encore confirmée (`emailNotVerified`). Depuis 1.3.0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502":
          description: L'envoi a échoué (`inviteSendFailed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: E-mail non configuré (`mailNotConfigured`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /lists/{listId}/read-password:
    parameters:
      - $ref: "#/components/parameters/listId"
    put:
      tags: [sharing]
      summary: Poser ou changer le mot de passe de lecture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sharing]
      summary: Retirer le mot de passe de lecture
      responses:
        "204": { description: OK }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/listId"
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [sharing]
      summary: Retirer un membre
      responses:
        "204": { description: Retiré }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /lists/{listId}/leave:
    parameters:
      - $ref: "#/components/parameters/listId"
    post:
      tags: [sharing]
      summary: Quitter la liste
      responses:
        "204": { description: Quittée }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /invitations/{inviteToken}:
    get:
      tags: [sharing]
      summary: Aperçu d'une invitation avant de la rejoindre
      description: |
        N'écrit rien. N'exige pas une adresse confirmée : seul `accept` l'exige (`emailNotVerified`).
        Depuis 1.4.0.
      parameters:
        - { name: inviteToken, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Invitation valide
          content:
            application/json:
              schema:
                type: object
                required: [title, listId]
                properties:
                  title: { type: string }
                  listId:
                    type: [string, "null"]
                    description: Rempli seulement si le compte est déjà membre de la liste.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: Invitation inconnue ou régénérée (`inviteLinkBroken`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invitations/{inviteToken}/accept:
    post:
      tags: [sharing]
      summary: Rejoindre une liste avec un lien d'invitation
      parameters:
        - { name: inviteToken, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Membre de la liste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: Adresse du compte pas encore confirmée (`emailNotVerified`). Depuis 1.3.0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------- Abonnements ----------

  /subscriptions:
    post:
      tags: [lists]
      summary: S'abonner à une liste publique par son lien ou son jeton
      parameters:
        - $ref: "#/components/parameters/readUnlock"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urlOrToken]
              properties:
                urlOrToken: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Abonné
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscribedListSummary" }
        "200":
          description: Déjà abonné
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscribedListSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "423":
          description: Mot de passe de lecture nécessaire (`readPasswordRequired`). Le corps contient aussi `title` et `readToken`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      title: { type: string }
                      readToken: { type: string }
        "429": { $ref: "#/components/responses/Error" }

  /subscriptions/{readToken}:
    parameters:
      - $ref: "#/components/parameters/readToken"
    delete:
      tags: [lists]
      summary: Se désabonner d'une liste suivie
      responses:
        "204": { description: Désabonné }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Jeton opaque rendu par /auth/login, /auth/register ou /me/password.

  parameters:
    readToken: { name: readToken, in: path, required: true, schema: { type: string } }
    listId: { name: listId, in: path, required: true, schema: { type: string } }
    itemId: { name: itemId, in: path, required: true, schema: { type: string } }
    reservationId: { name: reservationId, in: path, required: true, schema: { type: string } }
    readUnlock:
      name: X-Read-Unlock
      in: header
      required: false
      schema: { type: string }
      description: unlockToken de cette liste.
    reservationClaims:
      name: X-Reservation-Claims
      in: header
      required: false
      schema: { type: string }
      description: Claims de cette liste, séparés par des virgules (50 au plus).

  requestBodies:
    Label:
      description: >-
        Un libellé est unique dans sa liste, sans tenir compte de la casse ni des blancs autour :
        ajouter ou renommer vers un nom déjà pris est refusé (`typeExists` pour une catégorie,
        `personExists` pour un « qui »). Une entrée peut changer la casse de son propre nom.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [label]
            properties:
              label:
                type: string
                description: >-
                  À l'ajout, une saisie séparée par des virgules (ou des points-virgules, ou des
                  retours à la ligne) crée plusieurs entrées : « Wilh, Nathan » en fait deux.
                  Les blancs et les doublons de la saisie sont ignorés, et la réponse rend la
                  première entrée créée. Tout est enregistré en une seule écriture : si l'une est
                  refusée, aucune n'est créée. Au renommage, le libellé est pris tel quel —
                  « Papa, maman » reste un seul nom.

  responses:
    Error:
      description: Erreur. `code` stable, `message` traduit selon Accept-Language.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Label:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Label" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Codes de `locales/*/errors.json`, plus : unauthorized, invalidCredentials,
                mustChangePassword, readPasswordRequired, invalidJson, payloadTooLarge,
                unsupportedMediaType, originNotAllowed, apiVersionUnsupported, notFound.
              example: itemAlreadyReserved
            message: { type: string }

    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: Rendu une seule fois. }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/Me" }

    Me:
      type: object
      required: [id, email, displayName, mustChangePassword, emailVerified, pendingEmail]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        mustChangePassword: { type: boolean }
        emailVerified:
          type: boolean
          description: |
            Faux seulement si la validation est exigée (envoi d'e-mail actif) et l'adresse pas encore
            confirmée : créer une liste, rejoindre ou inviter est alors refusé. Depuis 1.3.0.
        pendingEmail:
          type: [string, "null"]
          description: Nouvelle adresse en attente de confirmation (lien envoyé, encore valable). Depuis 1.3.0.

    Theme:
      type: object
      properties:
        primary: { type: string, example: "#b4235a" }
        accent: { type: string }
        highlight: { type: string }
        background: { type: string }

    Label:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    Category:
      allOf:
        - $ref: "#/components/schemas/Label"
        - type: object
          required: [sortOrder]
          properties:
            sortOrder: { type: integer }

    PublicItem:
      type: object
      required: [id, name, typeId, personId, url, imageUrl, priceCents, priceLabel, priority, secondHandOk, description, mine, reservationId]
      properties:
        id: { type: string }
        name: { type: string }
        typeId: { type: string }
        personId: { type: string }
        url: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        priceCents: { type: [integer, "null"] }
        priceLabel: { type: [string, "null"], description: Formaté selon Accept-Language. }
        priority: { type: [string, "null"] }
        secondHandOk: { type: boolean, description: "Depuis 1.5.0. L'idée convient aussi d'occasion." }
        description: { type: [string, "null"], description: "Depuis 1.5.0. Contexte écrit par la liste : ce qu'est le produit, pourquoi il fait envie." }
        mine: { type: boolean, description: Réservée par ce client. }
        reservationId: { type: [string, "null"], description: Seulement si `mine`. }

    PublicList:
      type: object
      required: [title, subtitle, coverImageUrl, theme, subscribed, isMember, categories, people, items]
      properties:
        title: { type: string }
        subtitle: { type: [string, "null"] }
        coverImageUrl: { type: [string, "null"] }
        theme: { $ref: "#/components/schemas/Theme" }
        subscribed: { type: boolean, description: Depuis 1.7.0. }
        isMember: { type: boolean, description: Depuis 1.7.0. }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        people: { type: array, items: { $ref: "#/components/schemas/Label" } }
        items: { type: array, items: { $ref: "#/components/schemas/PublicItem" } }

    SubscribedListSummary:
      type: object
      required: [id, readToken, title, subtitle, coverImageUrl, theme, itemCount, readUrl, subscribedAt, locked]
      properties:
        id: { type: string }
        readToken: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        coverImageUrl: { type: [string, "null"] }
        theme: { $ref: "#/components/schemas/Theme" }
        itemCount: { type: integer }
        readUrl: { type: string }
        subscribedAt: { type: string, format: date-time }
        locked: { type: boolean }

    ListSummary:
      type: object
      required: [id, title, subtitle, coverImageUrl, theme, role, itemCount, readUrl]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"], description: Depuis 1.1.0. }
        coverImageUrl: { type: [string, "null"], description: Depuis 1.1.0. }
        theme: { $ref: "#/components/schemas/Theme" }
        role: { enum: [owner, member] }
        itemCount: { type: integer }
        readUrl: { type: string }

    ClientId:
      type: string
      pattern: "^[A-Za-z0-9_-]{16,32}$"
      description: Identifiant choisi par le client (hors format → `idInvalid`).
    ItemInput:
      type: object
      required: [name, typeId, personId]
      properties:
        name: { type: string }
        typeId: { type: string }
        personId: { type: string }
        url: { type: string, description: Vide ou absent = pas de lien. }
        imageUrl: { type: string }
        price: { type: string, description: Comme saisi sur le site (« 12,50 »). Invalide → priceInvalid. }
        priority: { type: string }
        secondHandOk:
          type: boolean
          description: "Depuis 1.5.0. Absent à la création : false. Absent en modification : la valeur enregistrée est gardée."
        description:
          type: [string, "null"]
          maxLength: 2000
          description: "Depuis 1.5.0. Absente à la création : aucune. Absente en modification : celle enregistrée est gardée. Vide ou null l'efface. Plus de 2000 caractères → descriptionTooLong."

    ItemTransfer:
      type: object
      required: [targetListId, typeId, personId]
      properties:
        targetListId: { type: string, description: Liste d'arrivée (la même est permise pour une copie). }
        typeId: { type: string, description: Catégorie de la liste d'arrivée. }
        personId: { type: string, description: « Qui » de la liste d'arrivée. }

    MemberItem:
      type: object
      required: [id, name, typeId, personId, url, imageUrl, priceCents, priceLabel, priority, secondHandOk, description, archived, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        typeId: { type: string }
        personId: { type: string }
        url: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        priceCents: { type: [integer, "null"] }
        priceLabel: { type: [string, "null"] }
        priority: { type: [string, "null"] }
        secondHandOk: { type: boolean, description: Depuis 1.5.0. }
        description: { type: [string, "null"], description: Depuis 1.5.0. }
        archived: { type: boolean }
        sortOrder: { type: integer }

    MemberReservation:
      type: object
      required: [id, itemId, itemName, fromName, note, createdAt]
      properties:
        id: { type: string }
        itemId: { type: string }
        itemName: { type: string }
        fromName: { type: [string, "null"] }
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    Member:
      type: object
      required: [userId, displayName, role]
      properties:
        userId: { type: string }
        displayName: { type: string }
        role: { enum: [owner, member] }

    MemberList:
      type: object
      required: [id, title, subtitle, coverImageUrl, theme, role, readUrl, inviteUrl, hasReadPassword, categories, people, items, reservations, members]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        coverImageUrl: { type: [string, "null"] }
        theme: { $ref: "#/components/schemas/Theme" }
        role: { enum: [owner, member], description: Rôle du compte connecté. }
        readUrl: { type: string }
        inviteUrl: { type: string }
        hasReadPassword: { type: boolean }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        people: { type: array, items: { $ref: "#/components/schemas/Label" } }
        items: { type: array, items: { $ref: "#/components/schemas/MemberItem" }, description: Archivées comprises. }
        reservations: { type: array, items: { $ref: "#/components/schemas/MemberReservation" } }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }

    AccountDeletionPreview:
      type: object
      required: [deletedLists, transferredLists, reservationsKept]
      properties:
        deletedLists:
          type: array
          description: Listes dont le compte est le seul membre, effacées.
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string }
              title: { type: string }
        transferredLists:
          type: array
          description: Listes qui restent aux autres membres.
          items:
            type: object
            required: [id, title, newOwnerName]
            properties:
              id: { type: string }
              title: { type: string }
              newOwnerName: { type: [string, "null"], description: Nouveau propriétaire, si le compte l'était. }
        reservationsKept: { type: integer, minimum: 0 }
        followedLists:
          type: array
          description: Depuis 1.7.0. Listes publiques suivies sans en être membre, qui ne seront plus suivies.
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string }
              title: { type: string }

    AccountExport:
      type: object
      additionalProperties: false
      required: [format, version, exportedAt, account, lists, subscriptions, myReservations]
      properties:
        format: { const: ohyoushouldnt-export }
        version: { const: 1 }
        exportedAt: { type: string, format: date-time }
        account:
          type: object
          additionalProperties: false
          required: [email, displayName, createdAt, emailVerifiedAt, pendingEmail]
          properties:
            email: { type: string }
            displayName: { type: string }
            createdAt: { type: string, format: date-time }
            emailVerifiedAt:
              type: [string, "null"]
              format: date-time
              description: Date de confirmation de l'adresse, null si elle n'est pas confirmée. Depuis 1.3.0.
            pendingEmail:
              type: [string, "null"]
              description: Nouvelle adresse en attente de confirmation. Depuis 1.3.0.
        lists:
          type: array
          items: { $ref: "#/components/schemas/ExportedList" }
        subscriptions:
          type: array
          description: Listes publiques suivies par ce compte. Depuis 1.7.0.
          items:
            type: object
            additionalProperties: false
            required: [title, subtitle, publicUrl, subscribedAt]
            properties:
              title: { type: string }
              subtitle: { type: [string, "null"] }
              publicUrl: { type: string }
              subscribedAt: { type: string, format: date-time }
        myReservations:
          type: array
          description: Réservations faites connecté sur des listes dont le compte n'est pas membre.
          items:
            type: object
            additionalProperties: false
            required: [listTitle, item, fromName, note, createdAt]
            properties:
              listTitle: { type: string }
              item: { type: [string, "null"] }
              fromName: { type: [string, "null"] }
              note: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }

    ExportedList:
      type: object
      additionalProperties: false
      required: [title, subtitle, createdAt, role, joinedAt, theme, coverImageUrl, publicUrl, readPasswordProtected, members, categories, people, items, reservations]
      properties:
        title: { type: string }
        subtitle: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        role: { enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
        theme: { $ref: "#/components/schemas/Theme" }
        coverImageUrl: { type: [string, "null"] }
        publicUrl: { type: string }
        readPasswordProtected: { type: boolean }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [displayName, role, joinedAt]
            properties:
              displayName: { type: string }
              role: { enum: [owner, member] }
              joinedAt: { type: string, format: date-time }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, sortOrder]
            properties:
              label: { type: string }
              sortOrder: { type: integer }
        people:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              label: { type: string }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, category, person, priceCents, url, imageUrl, priority, archived]
            properties:
              name: { type: string }
              category: { type: [string, "null"] }
              person: { type: [string, "null"] }
              priceCents: { type: [integer, "null"] }
              url: { type: [string, "null"] }
              imageUrl: { type: [string, "null"] }
              priority: { type: [string, "null"] }
              archived: { type: boolean }
        reservations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [item, fromName, note, createdAt, byMe]
            properties:
              item: { type: [string, "null"] }
              fromName: { type: [string, "null"] }
              note: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
              byMe: { type: boolean, description: Réservation faite par ce compte. }
