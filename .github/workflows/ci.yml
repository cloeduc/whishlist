# Checks for each PR and each push to main or staging: site, mobile app, Docker image.
# `pull_request` (not `pull_request_target`): code from a fork runs without secrets, with a read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# A PR: only the latest push counts. main: each merge keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Site (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile app (API types, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # The app reuses site modules (src/i18n, locales…): it also needs the root dependencies.
      - run: npm ci
      - run: npm --prefix mobile ci
      # First, with a clear message: this is the most common omission after a contract change.
      - name: API types match the contract
        run: |
          npm --prefix mobile run api:types
          if ! git diff --quiet -- mobile/src/api/schema.d.ts; then
            echo "::error file=mobile/src/api/schema.d.ts::mobile/src/api/schema.d.ts does not match the API contract (specs/004-mobile-api/contracts/openapi.yaml). Run 'npm --prefix mobile run api:types' and commit mobile/src/api/schema.d.ts."
            git diff --stat -- mobile/src/api/schema.d.ts
            exit 1
          fi
      - run: npm --prefix mobile run lint
      - run: npm --prefix mobile run typecheck
      - run: npm --prefix mobile test -- --ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t whishlist:ci .
