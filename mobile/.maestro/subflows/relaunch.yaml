# Closes the app and reopens it without clearing its data, with the same dev client settings as launch-clean.
# The caller waits for the expected screen.
appId: app.ohyoushouldnt.mobile
---
- stopApp
- launchApp:
    arguments:
      EXDevMenuShowFloatingActionButton: "NO"
      EXDevMenuShowsAtLaunch: "NO"
      EXDevMenuIsOnboardingFinished: "YES"
- runFlow: dev-client-reconnect.yaml
