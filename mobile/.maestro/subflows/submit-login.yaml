# Fills and submits the login form: env EMAIL, PASSWORD. Waits for no screen
# (login accepted or refused: the caller checks).
appId: app.ohyoushouldnt.mobile
---
- tapOn:
    id: login.email
- inputText: ${EMAIL}
- tapOn:
    id: login.password
- inputText: ${PASSWORD}
- hideKeyboard:
    optional: true
- tapOn:
    id: login.submit
# iOS offers to save the password after login: « Plus tard ».
- tapOn:
    text: Plus tard|Not Now
    optional: true
