# From the login screen: fills and submits the sign-up form, env NAME and EMAIL, password DEMO_PASSWORD.
# Waits for no screen (account created, or address already used: the caller checks).
appId: app.ohyoushouldnt.mobile
---
# A « Enregistrer le mot de passe ? » prompt from a previous login can show up late.
- tapOn:
    text: Plus tard|Not Now
    optional: true
- tapOn:
    id: login.create-account
# Leaving a filled login form makes this prompt show up at that moment.
- tapOn:
    text: Plus tard|Not Now
    optional: true
- tapOn:
    id: register.name
- inputText: ${NAME}
- tapOn:
    id: register.email
- inputText: ${EMAIL}
- tapOn:
    id: register.password
# iOS offers a strong password in a system sheet, invisible to Maestro:
# we close it with its cross, then go back to the field.
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: 92%,61%
      - tapOn:
          id: register.password
- inputText: ${MAESTRO_DEMO_PASSWORD}
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: register.submit
- tapOn:
    id: register.submit
# iOS offers to save the password after sign-up: « Plus tard ».
- tapOn:
    text: Plus tard|Not Now
    optional: true
