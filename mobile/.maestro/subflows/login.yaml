# Login with a demo account (alex@ or camille@example.test): env EMAIL; password DEMO_PASSWORD.
# Then checks the demo list: it only exists in tmp/e2e/wishlist.json, which proves that the app
# talks to the suite's local server before any write (an app pointed elsewhere stops here).
appId: app.ohyoushouldnt.mobile
---
- runFlow:
    file: submit-login.yaml
    env:
      PASSWORD: ${MAESTRO_DEMO_PASSWORD}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
- assertVisible:
    id: lists.card-demo-list
