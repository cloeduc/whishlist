# New account e2e-<unique>@example.test (R6), password DEMO_PASSWORD, from the login screen,
# without confirming its address (010). Returns the address in output.email; waits for « Mes listes ».
appId: app.ohyoushouldnt.mobile
---
# Before creating an account: proof that the app talks to the suite's local server (see login.yaml).
- runFlow:
    file: login.yaml
    env:
      EMAIL: alex@example.test
- runFlow: logout.yaml
- runScript: ../scripts/unique.js
- evalScript: ${output.email = 'e2e-' + output.unique + '@example.test'}
- runFlow:
    file: submit-register.yaml
    env:
      NAME: E2E ${output.unique}
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
