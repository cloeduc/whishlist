# Empty app at the start of each flow (R5): data cleared, and iOS keychain emptied
# (otherwise the session token survives and the app comes back logged in).
appId: app.ohyoushouldnt.mobile
---
# An offline flow stopped before its end would leave the emulator in airplane mode.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- launchApp:
    clearState: true
    clearKeychain: true
    # Debug build, iOS: dev client settings passed as launch arguments (they take precedence over UserDefaults):
    # no tools button, no developer menu on open, no welcome screen. No effect in Release.
    arguments:
      EXDevMenuShowFloatingActionButton: "NO"
      EXDevMenuShowsAtLaunch: "NO"
      EXDevMenuIsOnboardingFinished: "YES"
- runFlow: dev-client-reconnect.yaml
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 60000
