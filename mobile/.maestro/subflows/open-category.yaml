# On the Ideas tab: expands the category CATEGORY if the idea ITEM is not visible.
appId: app.ohyoushouldnt.mobile
---
- runFlow:
    when:
      notVisible: ${ITEM}
    commands:
      - scrollUntilVisible:
          element:
            text: ${CATEGORY}.*
      # The category button's label is « <nom> <nombre d'idées> ».
      - tapOn: ${CATEGORY}.*
- scrollUntilVisible:
    element:
      text: ${ITEM}
