# Checks that the system share sheet is open, then closes it.
appId: app.ohyoushouldnt.mobile
---
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: ShareSheet.RemoteContainerView
          timeout: 10000
      # System dismiss area, above the sheet.
      - tapOn:
          id: PopoverDismissRegion
- runFlow:
    when:
      platform: Android
    commands:
      # Android share chooser (resolver or intentresolver depending on the version). Not checked on
      # an emulator when this was written: to confirm on the first Android run (T031).
      - extendedWaitUntil:
          visible:
            id: .*:id/(resolver_list|chooser_.*|profile_pager|sem_chooser.*)
          timeout: 10000
      - back
