# Debug build: if the dev client launcher shows instead of the app, give it Metro (E2E_METRO_URL).
# No effect on a Release build, which has no launcher.
appId: app.ohyoushouldnt.mobile
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible: Development Build
    commands:
      # Same link as `expo run`: no floating button and no dev client welcome screen.
      - openLink: app.ohyoushouldnt.mobile://?__expo_url=${METRO_URL}&__expo_disable_fab=1&__expo_disable_onboarding=1
      # iOS asks « Ouvrir dans … ? » for a link to the app itself.
      - tapOn:
          text: Ouvrir|Open
          optional: true
      - waitForAnimationToEnd
# Safety net: if the developer menu opens despite the launch arguments, close it.
- runFlow:
    when:
      visible: Runtime version.*
    commands:
      - tapOn:
          id: xmark
