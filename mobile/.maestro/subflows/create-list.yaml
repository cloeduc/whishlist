# From « Mes listes »: new list TITLE, first category « Livres », for « Alex ».
# Waits for the list screen.
appId: app.ohyoushouldnt.mobile
---
- runFlow: fill-new-list.yaml
- tapOn:
    id: new-list.title
- inputText: ${TITLE}
- runFlow: submit-new-list.yaml
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 20000
