# From « Mes listes »: opens « Créer une liste » and fills the first category (« Livres ») and « Pour qui ? »
# (« Alex »), bottom to top so the keyboard never hides the next field. The title is left to the caller.
appId: app.ohyoushouldnt.mobile
---
- tapOn:
    id: lists.new
- tapOn:
    id: new-list.person
- inputText: Alex
- tapOn:
    id: new-list.category
- inputText: Livres
