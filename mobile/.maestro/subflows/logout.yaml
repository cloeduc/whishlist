# From « Mes listes »: « Mon compte » → « Se déconnecter »; waits for the login screen.
appId: app.ohyoushouldnt.mobile
---
- tapOn:
    id: open-account
- scrollUntilVisible:
    element:
      id: account.logout
- tapOn:
    id: account.logout
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 10000
