# On the Ideas tab: adds the idea NAME (default category and « qui »), goes back to the list.
appId: app.ohyoushouldnt.mobile
---
- runFlow: open-new-item.yaml
- tapOn:
    id: item-form.name
- inputText: ${NAME}
- runFlow: submit-item-form.yaml
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 10000
