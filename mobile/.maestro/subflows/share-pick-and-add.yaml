# After a received share: picks the list demo-list on « Ajouter à une liste », checks the prefilled link,
# names the idea NAME, adds it, then checks that the list opens with the idea (category Livres, the first one).
appId: app.ohyoushouldnt.mobile
---
- extendedWaitUntil:
    visible:
      id: incoming.screen
    timeout: 30000
- assertVisible:
    id: incoming.url
    text: ${URL}
- tapOn:
    id: incoming.list-demo-list
- extendedWaitUntil:
    visible:
      id: item-form.name
    timeout: 10000
- assertVisible:
    id: item-form.url
    text: ${URL}
# « Remplir depuis le lien » starts on its own: wait for it to finish before typing the name.
- extendedWaitUntil:
    visible:
      id: enrich
      enabled: true
    timeout: 15000
- tapOn:
    id: item-form.name
- inputText: ${NAME}
- runFlow: submit-item-form.yaml
# The saved idea opens the list (on a cold start, there is no screen behind the form).
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 10000
- assertNotVisible:
    id: item-form.screen
- runFlow:
    file: open-category.yaml
    env:
      CATEGORY: Livres
      ITEM: ${NAME}
