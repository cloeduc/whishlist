# New account e2e-<unique>@example.test (R6), password DEMO_PASSWORD, from the login screen,
# address confirmed by the link received in MailDev (010). Returns the address in output.email; waits for « Mes listes ».
appId: app.ohyoushouldnt.mobile
---
# Expected texts (output.t): some calling flows do not load them themselves.
- runScript: ../scripts/strings.generated.js
- runFlow: register-unconfirmed.yaml
- runFlow:
    file: confirm-email.yaml
    env:
      TO: ${output.email}
      DONE: ${output.t.auth.confirmEmail.verified}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: verify.banner
    timeout: 10000
