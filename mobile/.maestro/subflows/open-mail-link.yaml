# Opens in the app (ohyoushouldnt:// scheme) the last KIND link received by TO in MailDev:
# confirmer-email, reinitialiser or inviter (011). Locally, the web link would open the browser.
appId: app.ohyoushouldnt.mobile
---
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: ../scripts/maildev-link.js
          env:
            TO: ${TO}
            KIND: ${KIND}
- runScript:
    file: ../scripts/app-link.js
    env:
      URL: ${output.link}
- openLink: ${output.appLink}
