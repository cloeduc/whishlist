# iOS: opens URL in Safari and shares it to the app through the system share sheet.
# The app's cell lives in a remote view: Maestro sees it (shareCell), but with positions relative to
# the sheet, so we tap its position on screen (3rd icon of the apps row). Position measured on an
# iPhone 17 Pro Max (iOS 26.5): to check on another model (see exclusions.md).
appId: com.apple.mobilesafari
---
- launchApp:
    appId: com.apple.mobilesafari
- openLink:
    link: ${URL}
    browser: true
- tapOn:
    id: MoreMenuButton
- tapOn:
    id: ShareButton
- extendedWaitUntil:
    visible:
      id: ShareSheet.RemoteContainerView
    timeout: 10000
- assertVisible:
    id: shareCell
    index: 2
- tapOn:
    point: "61%,72%"
