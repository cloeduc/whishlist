# 005 US2: my lists (Alex sees the demo list); with a new account, new list opened then shown
# in « Mes listes »; a list created without filling anything takes the site's default values (name based on the
# account name). See specs/005-mobile-list-app/spec.md.
appId: app.ohyoushouldnt.mobile
name: "005 US2 — See your lists and create one"
tags:
  - 005-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- assertVisible:
    id: lists.card-demo-list
- runFlow: ../subflows/logout.yaml

# New account, so that the counted lists depend on no other flow.
- runFlow: ../subflows/register.yaml
- assertVisible:
    id: lists.empty

# New list: it opens, then shows in « Mes listes ».
- runFlow:
    file: ../subflows/create-list.yaml
    env:
      TITLE: Noël ${output.unique}
- assertVisible: Noël ${output.unique}
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Noël ${output.unique}

# Nothing filled: as on the site, each field takes its default value and the list opens.
- tapOn:
    id: lists.new
- extendedWaitUntil:
    visible:
      id: new-list.screen
    timeout: 10000
- runFlow: ../subflows/submit-new-list.yaml
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 20000
# Default name based on the account name (« E2E <unique> », register.yaml), in French or in English:
# a text with a variable, missing from output.t, so checked by pattern.
- assertVisible: "(Liste de E2E ${output.unique}|E2E ${output.unique}’s list)"
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
# Two lists: « Noël » and the default list.
- assertVisible:
    id: lists\.card-.*(?<!-shadow)
    index: 1
- assertNotVisible:
    id: lists\.card-.*(?<!-shadow)
    index: 2
