# 012 US3: unfollow a followed list from the mobile app; the list disappears from « Listes suivies ».
appId: app.ohyoushouldnt.mobile
name: "012 US3 — Unfollow a followed list"
tags:
  - 012-us3
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js

# New account that follows the demo list.
- runFlow: ../subflows/register.yaml
- tapOn:
    id: lists.follow-open
- tapOn:
    id: follow.link
- inputText: demo-list-lecture
- tapOn:
    id: follow.submit
- extendedWaitUntil:
    visible:
      id: guest.screen
    timeout: 10000

# Unfollow, with confirmation: the list view offers « Suivre cette liste » again.
- tapOn:
    id: guest.unfollow
- extendedWaitUntil:
    visible:
      id: guest.unfollow-confirm
    timeout: 10000
- tapOn:
    id: guest.unfollow-confirm
- extendedWaitUntil:
    visible:
      id: guest.follow
    timeout: 10000

# Back to « Mes listes »: the list is no longer in « Listes suivies ».
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
- assertNotVisible:
    id: lists.shared-card-demo-list-lecture
- assertVisible:
    id: lists.subscriptions-empty
