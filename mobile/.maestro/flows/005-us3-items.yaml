# 005 US3: add an idea, invalid price refused without losing the input, edit, archive then unarchive,
# refusal to remove a used category, add a category, delete with confirmation, see a reservation
# with the giver and their note. See specs/005-mobile-list-app/spec.md.
appId: app.ohyoushouldnt.mobile
name: "005 US3 — Fill a list"
tags:
  - 005-us3
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- runFlow:
    file: ../subflows/create-list.yaml
    env:
      TITLE: Idées ${output.unique}

# With no prefill service configured, the button does not promise AI.
- runFlow: ../subflows/open-new-item.yaml
- assertVisible:
    id: enrich
- assertNotVisible: ${output.t.list.form.fetchInfosAi}

# Invalid price (three decimals, only digits and separator go through the decimal pad):
# message under the form, the typed name stays.
# The price (lower down) first: the keyboard does not hide the next field.
- tapOn:
    id: item-form.price
- inputText: "${APP_LANG == 'en' ? '1.234' : '1,234'}"
- tapOn:
    id: item-form.name
- inputText: Puzzle ${output.unique}
- runFlow: ../subflows/submit-item-form.yaml
- extendedWaitUntil:
    visible:
      id: form-error
    timeout: 10000
- assertVisible: ${output.t.errors.priceInvalid}
- assertVisible: Puzzle ${output.unique}

# Valid price: the idea shows in its category.
- tapOn:
    id: item-form.price
- eraseText: 10
- inputText: "${APP_LANG == 'en' ? '24.90' : '24,90'}"
- runFlow: ../subflows/submit-item-form.yaml
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 10000
- runFlow:
    file: ../subflows/open-category.yaml
    env:
      CATEGORY: Livres
      ITEM: Puzzle ${output.unique}

# Edit the name.
- tapOn:
    id: item-card.edit
- extendedWaitUntil:
    visible:
      id: item-form.screen
    timeout: 10000
- tapOn:
    id: item-form.name
- eraseText: 40
- inputText: Puzzle 1000 ${output.unique}
- runFlow: ../subflows/submit-item-form.yaml
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 10000
- runFlow:
    file: ../subflows/open-category.yaml
    env:
      CATEGORY: Livres
      ITEM: Puzzle 1000 ${output.unique}

# Archive, find it in Archives, unarchive it.
- tapOn:
    id: item-card.archive
- extendedWaitUntil:
    notVisible: Puzzle 1000 ${output.unique}
    timeout: 10000
- scrollUntilVisible:
    element:
      id: tab-archives
    direction: UP
- tapOn:
    id: tab-archives
- extendedWaitUntil:
    visible: Puzzle 1000 ${output.unique}
    timeout: 10000
- tapOn:
    id: archives.restore
- extendedWaitUntil:
    notVisible: Puzzle 1000 ${output.unique}
    timeout: 10000
- tapOn:
    id: tab-idees
- runFlow:
    file: ../subflows/open-category.yaml
    env:
      CATEGORY: Livres
      ITEM: Puzzle 1000 ${output.unique}

# Settings: a category that still holds an idea cannot be removed; we add one.
- scrollUntilVisible:
    element:
      id: tab-reglages
    direction: UP
- tapOn:
    id: tab-reglages
- tapOn:
    id: settings.types-delete-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: settings.types-error
    timeout: 10000
- assertVisible: ${output.t.errors.typeInUse}
- assertVisible: .*Livres.*
- tapOn:
    id: settings.types-new
- inputText: Jeux ${output.unique}
- hideKeyboard:
    optional: true
- tapOn:
    id: settings.types-add
- extendedWaitUntil:
    visible: .*Jeux ${output.unique}.*
    timeout: 10000
- scrollUntilVisible:
    element:
      id: tab-idees
    direction: UP
- tapOn:
    id: tab-idees
- runFlow:
    file: ../subflows/open-category.yaml
    env:
      CATEGORY: Livres
      ITEM: Puzzle 1000 ${output.unique}

# Delete, with confirmation.
- tapOn:
    id: item-card.edit
- extendedWaitUntil:
    visible:
      id: item-form.screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: item-form.delete
- tapOn:
    id: item-form.delete
- tapOn:
    id: item-form.delete-confirm
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 10000
- assertNotVisible: Puzzle 1000 ${output.unique}

# Reservations: the one on the demo list shows the giver and their note.
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: back-link.back
    direction: UP
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
- tapOn:
    id: lists.card-demo-list
- tapOn:
    id: tab-reservations
- extendedWaitUntil:
    visible:
      id: reservations.item-demo-reservation
    timeout: 10000
- assertVisible: .*Morgan.*
- assertVisible:
    id: reservations.note-demo-reservation
