# 017 US3: the owner of a list made by the flow protects it with a read password from the app:
# too short refused, saved, replaced; signed out, the public link refuses the old password and
# opens with the new one; then the password is removed.
appId: app.ohyoushouldnt.mobile
name: "017 US3 — Protect a list with a read password"
tags:
  - 017-us3
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runFlow: ../subflows/register.yaml
- evalScript: ${output.emailA = output.email; output.listTitle = 'Protégée ' + output.unique}
- runFlow:
    file: ../subflows/create-list.yaml
    env:
      TITLE: ${output.listTitle}
- tapOn:
    id: tab-partage
- scrollUntilVisible:
    element:
      id: share.read-link
- copyTextFrom:
    id: share.read-link
- evalScript: ${output.readUrl = maestro.copiedText}

# Too short: the server's message, nothing saved.
- scrollUntilVisible:
    element:
      id: share.save-password
- assertVisible:
    id: share.password-state
    text: ${output.t.list.share.readPasswordUnset}
- tapOn:
    id: share.read-password
- inputText: court
- hideKeyboard
- tapOn:
    id: share.save-password
- scrollUntilVisible:
    element:
      id: share.password-error
    timeout: 10000
    direction: UP

# Saved: the card and the notice of the public link card say the list is protected.
- scrollUntilVisible:
    element:
      id: share.read-password
- tapOn:
    id: share.read-password
- eraseText
- inputText: secretliste
- hideKeyboard
- tapOn:
    id: share.save-password
- scrollUntilVisible:
    element:
      id: share.password-saved
    timeout: 10000
    direction: UP
- assertVisible:
    id: share.password-state
    text: ${output.t.list.share.readPasswordSet}
- scrollUntilVisible:
    element:
      id: password-notice
    direction: UP

# Replaced (scenario 4): the previous password stops working.
- scrollUntilVisible:
    element:
      id: share.read-password
- tapOn:
    id: share.read-password
- inputText: autresecret
- hideKeyboard
- tapOn:
    id: share.save-password
- scrollUntilVisible:
    element:
      id: share.password-saved
    timeout: 10000
    direction: UP

# Signed out, the public link asks for the password: the old one is refused, the new one opens the list.
- runFlow: ../subflows/back-and-logout.yaml
- runFlow:
    file: ../subflows/open-app-link.yaml
    env:
      URL: ${output.readUrl}
- extendedWaitUntil:
    visible:
      id: guest.password
    timeout: 20000
- tapOn:
    id: guest.password
- inputText: secretliste
- hideKeyboard
- tapOn:
    id: guest.unlock
- extendedWaitUntil:
    visible:
      id: guest.unlock-error
    timeout: 20000
- tapOn:
    id: guest.password
- eraseText
- inputText: autresecret
- hideKeyboard
- tapOn:
    id: guest.unlock
- extendedWaitUntil:
    visible: ${output.listTitle}
    timeout: 20000

# The owner removes the password.
- launchApp
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 20000
- runFlow:
    file: ../subflows/submit-login.yaml
    env:
      EMAIL: ${output.emailA}
      PASSWORD: ${MAESTRO_DEMO_PASSWORD}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
- tapOn: ${output.listTitle}
- tapOn:
    id: tab-partage
- scrollUntilVisible:
    element:
      id: share.clear-password
- tapOn:
    id: share.clear-password
- tapOn:
    id: share.clear-password-confirm
- scrollUntilVisible:
    element:
      id: share.password-cleared
    timeout: 10000
    direction: UP
- assertVisible:
    id: share.password-state
    text: ${output.t.list.share.readPasswordUnset}
- assertNotVisible:
    id: password-notice
