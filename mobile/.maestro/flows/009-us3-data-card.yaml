# 009 US3: the « Vos données et informations » card opens collapsed, expands, stays expanded
# when coming back from a legal page, then collapses.
appId: app.ohyoushouldnt.mobile
name: "009 US3 — Expand the Data and information card"
tags:
  - 009-us3
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: open-account
- extendedWaitUntil:
    visible:
      id: account.data-toggle
    timeout: 10000
- assertNotVisible:
    id: account.legal
- assertVisible:
    id: account.logout

# Expanded: the links show, and the card stays so when coming back from the legal notice.
- tapOn:
    id: account.data-toggle
- scrollUntilVisible:
    element:
      id: account.legal
- tapOn:
    id: account.legal
- extendedWaitUntil:
    visible:
      id: legal-mentions.screen
    timeout: 10000
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: account.legal
    timeout: 10000

# Collapsed again.
- scrollUntilVisible:
    element:
      id: account.data-toggle
    direction: UP
- tapOn:
    id: account.data-toggle
- assertNotVisible:
    id: account.legal
