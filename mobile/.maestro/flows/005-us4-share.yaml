# 005 US4: QR code, public link (never the invite link in its field), copy confirmed, share sheet opened.
# Scanning the QR code and what the share sheet receives stay manual (exclusions.md).
appId: app.ohyoushouldnt.mobile
name: "005 US4 — Share a list publicly"
tags:
  - 005-us4
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: lists.card-demo-list
- tapOn:
    id: tab-partage
- extendedWaitUntil:
    visible:
      id: qr-code
    timeout: 10000
- scrollUntilVisible:
    element:
      id: share.read-link
- assertVisible:
    id: share.read-link
    text: .*/l/demo-list-lecture.*
# The invite link has its own card (017): it is never in the public link field.
- assertNotVisible:
    id: share.read-link
    text: .*demo-list-invitation.*

- scrollUntilVisible:
    element:
      id: copy-link
- tapOn:
    id: copy-link
# The message shows under the field, sometimes below the bottom of the screen: scroll down to it.
- scrollUntilVisible:
    element:
      id: share.copied
    timeout: 5000

# The system share sheet opens; we close it.
- scrollUntilVisible:
    element:
      id: share.share
    direction: UP
- tapOn:
    id: share.share
- runFlow:
    file: ../subflows/close-share-sheet.yaml
- extendedWaitUntil:
    visible:
      id: share.share
    timeout: 10000
