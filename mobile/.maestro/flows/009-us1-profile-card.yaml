# 009 US1: the Profile card of « Mon compte » opens collapsed, expands to change the name, then collapses.
# Screen readers, reduce motion and airplane mode: by hand (exclusions.md).
appId: app.ohyoushouldnt.mobile
name: "009 US1 — Expand the Profile card to change your name"
tags:
  - 009-us1
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: open-account
- extendedWaitUntil:
    visible:
      id: account.profile-toggle
    timeout: 10000
- assertNotVisible:
    id: account.name

# Expanded: the form shows and stays open after saving.
- tapOn:
    id: account.profile-toggle
- assertVisible:
    id: account.name
- tapOn:
    id: account.name
- eraseText: 40
- inputText: Alex ${output.unique}
- hideKeyboard
- tapOn:
    id: account.save-name
- extendedWaitUntil:
    visible: ${output.t.auth.account.nameSaved}
    timeout: 10000
- assertVisible:
    id: account.name

# Collapsed again.
- tapOn:
    id: account.profile-toggle
- assertNotVisible:
    id: account.name
