# 006 US4: app version and open source licenses, at the bottom of « Mon compte ».
# The « Nous écrire » link is checked by hand (no Mail app on the iOS simulator).
appId: app.ohyoushouldnt.mobile
name: "006 US4 — Version, licenses and contact"
tags:
  - 006-us4
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: open-account
- runFlow: ../subflows/open-account-data.yaml
- scrollUntilVisible:
    element:
      id: account.version
- assertVisible:
    id: account.version
    text: .*${APP_VERSION}.*
- assertVisible:
    id: account.contact
- tapOn:
    id: account.licenses
- extendedWaitUntil:
    visible:
      id: legal-licenses.screen
    timeout: 10000
# Each license is a « version · licence » line (long list: we look at the top).
- assertVisible: .*\d+\.\d+.* · .*
