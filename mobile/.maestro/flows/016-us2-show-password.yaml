# 016 US2: the eye of a password field shows what was typed, then masks it again, and its
# label follows (« Afficher le mot de passe » / « Masquer le mot de passe »). On the login
# screen, the same component as every password field of the app. See specs/016-password-field/spec.md.
appId: app.ohyoushouldnt.mobile
name: "016 US2 — Show or hide the typed password"
tags:
  - 016-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js

# Masked by default: the typed text is not readable, the eye offers to show it.
- tapOn:
    id: login.password
- inputText: motdepasse-e2e
- hideKeyboard:
    optional: true
- assertNotVisible: motdepasse-e2e
- assertVisible:
    id: login.password-reveal
    text: ${output.t.common.passwordField.show}

# One touch: the text reads in clear, the eye now offers to hide it.
- tapOn:
    id: login.password-reveal
- assertVisible: motdepasse-e2e
- assertVisible:
    id: login.password-reveal
    text: ${output.t.common.passwordField.hide}

# A second touch: masked again, the text is unchanged.
- tapOn:
    id: login.password-reveal
- assertNotVisible: motdepasse-e2e
- assertVisible:
    id: login.password-reveal
    text: ${output.t.common.passwordField.show}
- tapOn:
    id: login.password-reveal
- assertVisible: motdepasse-e2e
