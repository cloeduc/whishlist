# 012 US2: follow a list by pasting its link from « Mes listes », browse its ideas and reserve a gift.
appId: app.ohyoushouldnt.mobile
name: "012 US2 — Follow a list from its link and reserve a gift"
tags:
  - 012-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js

# New account (not a member of the demo list).
- runFlow: ../subflows/register.yaml
- assertVisible:
    id: lists.subscriptions-section
- tapOn:
    id: lists.follow-open
- assertVisible:
    id: follow.screen
- tapOn:
    id: follow.link
- inputText: demo-list-lecture
- tapOn:
    id: follow.submit
- extendedWaitUntil:
    visible:
      id: guest.screen
    timeout: 10000
- assertVisible: Nos envies toute l’année
- assertVisible:
    id: guest.unfollow

# Reserve an idea on the followed list, with a message.
- tapOn:
    id: guest.offer-0
- extendedWaitUntil:
    visible:
      id: guest-reserve.note
    timeout: 10000
- tapOn:
    id: guest-reserve.note
- inputText: "Pour Noël"
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: guest-reserve.submit
- tapOn:
    id: guest-reserve.submit
- extendedWaitUntil:
    visible: ${output.t.public.reservation.mine}
    timeout: 10000

# Back to « Mes listes »: the list is in « Listes suivies ».
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.shared-card-demo-list-lecture
    timeout: 10000
