# 011 US1: the links received by email (address confirmation, reset, login) open in
# the app and do the action there. The links come from MailDev and open through the ohyoushouldnt:// scheme:
# locally, the domain is not associated with the app (research R10).
appId: app.ohyoushouldnt.mobile
name: "011 US1 — Account email links open the app"
tags:
  - 011-us1
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runFlow: ../subflows/register-unconfirmed.yaml
- assertVisible:
    id: verify.banner

# Confirmation link: confirmed as soon as it opens in the app, with no browser and no button.
- runFlow:
    file: ../subflows/open-mail-link.yaml
    env:
      TO: ${output.email}
      KIND: confirm-email
- extendedWaitUntil:
    visible:
      id: confirm-email.status
    timeout: 20000
- tapOn:
    id: confirm-email.next
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000
- assertNotVisible:
    id: verify.banner

# Login link, already logged in: their lists.
- openLink: ohyoushouldnt://login
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000

# Forgotten password: the reset link opens the app's form, which logs in.
- runFlow: ../subflows/logout.yaml
- tapOn:
    id: login.forgot
- tapOn:
    id: forgot.email
- inputText: ${output.email}
- hideKeyboard:
    optional: true
- tapOn:
    id: forgot.submit
- extendedWaitUntil:
    visible:
      id: forgot.sent
    timeout: 10000
- runFlow:
    file: ../subflows/open-mail-link.yaml
    env:
      TO: ${output.email}
      KIND: reset-password
- extendedWaitUntil:
    visible:
      id: reset-password.screen
    timeout: 20000
- tapOn:
    id: reset-password.password
# iOS offers a strong password in a system sheet (see submit-register.yaml).
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: 92%,61%
      - tapOn:
          id: reset-password.password
- inputText: ${MAESTRO_DEMO_PASSWORD}-011
- hideKeyboard:
    optional: true
- tapOn:
    id: reset-password.submit
- tapOn:
    text: Plus tard|Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
