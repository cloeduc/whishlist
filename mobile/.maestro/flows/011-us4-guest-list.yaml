# 011 US4: the public link of the demo list (fixed token of the suite's database) opens the guest view of
# the app, without an account: reserve an idea with a name, see it marked « Réservé par vous », then cancel.
# The link opens through the ohyoushouldnt:// scheme (research R10).
appId: app.ohyoushouldnt.mobile
name: "011 US4 — A list's public link opens the app, even without an account"
tags:
  - 011-us4
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
# Proof of the local server before writing, then without an account.
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- runFlow: ../subflows/logout.yaml

- openLink: ohyoushouldnt://l/demo-list-lecture
- extendedWaitUntil:
    visible:
      id: guest.title
    timeout: 20000
- assertNotVisible:
    id: list.add-item

# Reserve the first idea, with a name.
- tapOn:
    id: guest.offer-0
- extendedWaitUntil:
    visible:
      id: guest-reserve.from-name
    timeout: 10000
- tapOn:
    id: guest-reserve.from-name
- inputText: E2E invité
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: guest-reserve.submit
- tapOn:
    id: guest-reserve.submit
- extendedWaitUntil:
    visible: ${output.t.public.reservation.mine}
    timeout: 20000

# Cancel one's reservation: the idea can be reserved again.
- scrollUntilVisible:
    element:
      id: guest.cancel-0
- tapOn:
    id: guest.cancel-0
- tapOn:
    id: guest.cancel-confirm-0
- extendedWaitUntil:
    notVisible: ${output.t.public.reservation.mine}
    timeout: 20000
- assertVisible:
    id: guest.offer-0
