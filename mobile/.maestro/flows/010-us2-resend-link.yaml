# 010 US2: from the reminder, ask for a new link; it arrives (MailDev) and confirms the address.
appId: app.ohyoushouldnt.mobile
name: "010 US2 — Resend the confirmation link"
tags:
  - 010-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runFlow: ../subflows/register-unconfirmed.yaml
- assertVisible:
    id: verify.banner
- tapOn:
    id: verify.resend
- extendedWaitUntil:
    visible:
      id: verify.sent
    timeout: 10000

# Two links received: the sign-up one and the new one; only the last one confirms.
- runScript:
    file: ../scripts/maildev-link.js
    env:
      TO: ${output.email}
- assertTrue: ${output.confirmLinks == 2}
- runFlow:
    file: ../subflows/confirm-email.yaml
    env:
      TO: ${output.email}
      DONE: ${output.t.auth.confirmEmail.verified}
- extendedWaitUntil:
    notVisible:
      id: verify.banner
    timeout: 15000
