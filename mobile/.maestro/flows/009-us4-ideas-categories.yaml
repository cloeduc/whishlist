# 009 US4: the categories of the Ideas tab open collapsed and expand with the same animation
# as the account cards; each keeps its state. Animation and « réduire les animations »: by hand.
appId: app.ohyoushouldnt.mobile
name: "009 US4 — Expand an idea category"
tags:
  - 009-us4
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: lists.card-demo-list
- extendedWaitUntil:
    visible:
      id: list.screen
    timeout: 10000
- assertNotVisible: Lampe de lecture

# Expanded: its ideas show.
- runFlow:
    file: ../subflows/open-category.yaml
    env:
      CATEGORY: Maison
      ITEM: Lampe de lecture

# A second category opens without collapsing the first one.
- scrollUntilVisible:
    element:
      id: list.category-demo-list:loisirs
- tapOn:
    id: list.category-demo-list:loisirs
- scrollUntilVisible:
    element:
      text: Jeu de société coopératif
- scrollUntilVisible:
    element:
      text: Lampe de lecture
    direction: UP

# Collapsed again, by its identifier.
- scrollUntilVisible:
    element:
      id: list.category-demo-list:maison
    direction: UP
- tapOn:
    id: list.category-demo-list:maison
- assertNotVisible: Lampe de lecture
