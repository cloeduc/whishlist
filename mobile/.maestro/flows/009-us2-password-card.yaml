# 009 US2: the « Modifier le mot de passe » card opens collapsed, expands from its header, stays open
# with the Profile card, then collapses. Submitting the form is checked by hand (exclusions.md);
# the message in the open card is covered by __tests__/screens/account.test.tsx.
appId: app.ohyoushouldnt.mobile
name: "009 US2 — Expand the Password card"
tags:
  - 009-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- tapOn:
    id: open-account
- extendedWaitUntil:
    visible:
      id: account.password-toggle
    timeout: 10000
- assertNotVisible:
    id: account.password-current

# Expanded: the three fields and the button show.
- tapOn:
    id: account.password-toggle
- assertVisible:
    id: account.password-current
- assertVisible:
    id: account.password-next
- assertVisible:
    id: account.password-confirm

# Both cards can be open together.
- tapOn:
    id: account.profile-toggle
- assertVisible:
    id: account.name
- scrollUntilVisible:
    element:
      id: account.password-submit

# Collapsed again, the Profile card stays open.
- scrollUntilVisible:
    element:
      id: account.password-toggle
    direction: UP
- tapOn:
    id: account.password-toggle
- assertNotVisible:
    id: account.password-current
- scrollUntilVisible:
    element:
      id: account.name
    direction: UP
