# 010 US3: change one's address from « Mon compte »: the change stays pending until the link received
# by the new address (MailDev), the old one receives a notice, then we log in again with the new one.
appId: app.ohyoushouldnt.mobile
name: "010 US3 — Change your email address"
tags:
  - 010-us3
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runFlow: ../subflows/register.yaml
- evalScript: ${output.oldEmail = output.email}
- evalScript: ${output.newEmail = 'e2e-' + output.unique + '-b@example.test'}

- tapOn:
    id: open-account
- extendedWaitUntil:
    visible:
      id: account.email-toggle
    timeout: 10000
- tapOn:
    id: account.email-toggle
- tapOn:
    id: account.email-new
- inputText: ${output.newEmail}
- tapOn:
    id: account.email-password
- inputText: ${MAESTRO_DEMO_PASSWORD}
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: account.email-submit
- tapOn:
    id: account.email-submit

# Pending: the login address only changes when the link is opened.
- extendedWaitUntil:
    visible:
      id: account.email-pending
    timeout: 10000
- assertVisible: .*${output.newEmail}.*

- runFlow:
    file: ../subflows/confirm-email.yaml
    env:
      TO: ${output.newEmail}
      DONE: ${output.t.auth.confirmEmail.changed}
- extendedWaitUntil:
    notVisible:
      id: account.email-pending
    timeout: 15000

# The old address received the notice (on top of the sign-up link).
- runScript:
    file: ../scripts/maildev-count.js
    env:
      TO: ${output.oldEmail}
- assertTrue: ${output.inboxCount == 2}

# The address shown is the new one (account reloaded when back to the foreground).
- assertVisible: .*${output.newEmail}.*

# Logging in again with the new address.
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: back-link.back
    direction: UP
- tapOn:
    id: back-link.back
- runFlow: ../subflows/logout.yaml
- runFlow:
    file: ../subflows/submit-login.yaml
    env:
      EMAIL: ${output.newEmail}
      PASSWORD: ${MAESTRO_DEMO_PASSWORD}
- tapOn:
    text: Plus tard|Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
