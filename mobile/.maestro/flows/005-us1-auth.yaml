# 005 US1: login refused without saying which field is wrong, login kept after reopening the app,
# logout, forgotten password (same message for a known or unknown address), account creation,
# and address already used (no login). See specs/005-mobile-list-app/spec.md.
appId: app.ohyoushouldnt.mobile
name: "005 US1 — Sign in or create an account"
tags:
  - 005-us1
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js

# Wrong password: a single message, which does not say which of the two is wrong.
- runFlow:
    file: ../subflows/submit-login.yaml
    env:
      EMAIL: alex@example.test
      PASSWORD: mauvais-mot-de-passe
- extendedWaitUntil:
    visible:
      id: login.error
    timeout: 10000
- assertVisible: ${output.t.errors.invalidCredentials}
- assertNotVisible:
    id: lists.screen

# Alex logs in, then logs out.
- runFlow: ../subflows/launch-clean.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
- assertVisible:
    id: lists.card-demo-list

# Reopening the app: still logged in, without typing again.
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 60000
- runFlow: ../subflows/logout.yaml

# Forgotten password: same message for an unknown address and for a known address.
- tapOn:
    id: login.forgot
- tapOn:
    id: forgot.email
- inputText: inconnu-${output.unique}@example.test
- hideKeyboard:
    optional: true
- tapOn:
    id: forgot.submit
- extendedWaitUntil:
    visible:
      id: forgot.sent
    timeout: 10000
- assertVisible: ${output.t.auth.forgot.sent}
- tapOn:
    id: forgot.back
- tapOn:
    id: login.forgot
- tapOn:
    id: forgot.email
- inputText: alex@example.test
- hideKeyboard:
    optional: true
- tapOn:
    id: forgot.submit
- extendedWaitUntil:
    visible:
      id: forgot.sent
    timeout: 10000
- assertVisible: ${output.t.auth.forgot.sent}
- tapOn:
    id: forgot.back
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 10000

# New account: logged in, no list.
- runFlow: ../subflows/register.yaml
- assertVisible:
    id: lists.empty
- runFlow: ../subflows/logout.yaml

# Address already used: same message as a sign-up, no login.
- runFlow:
    file: ../subflows/submit-register.yaml
    env:
      NAME: Alex bis
      EMAIL: alex@example.test
- extendedWaitUntil:
    visible:
      id: register.sent
    timeout: 10000
- assertVisible: ${output.t.auth.register.sent}
- assertNotVisible:
    id: lists.screen
