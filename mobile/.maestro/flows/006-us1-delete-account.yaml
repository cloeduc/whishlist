# 006 US1: delete one's own account (created by the flow): summary, wrong password refused,
# deletion, back to login, old password refused, then a new account possible with the same address. See specs/006-mobile-legal-account/spec.md.
appId: app.ohyoushouldnt.mobile
name: "006 US1 — Delete your account"
tags:
  - 006-us1
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runFlow: ../subflows/register.yaml
- runFlow:
    file: ../subflows/create-list.yaml
    env:
      TITLE: À supprimer ${output.unique}
- tapOn:
    id: back-link.back
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 10000

- tapOn:
    id: open-account
- scrollUntilVisible:
    element:
      id: delete-account
- tapOn:
    id: delete-account
- extendedWaitUntil:
    visible:
      id: delete-account.summary
    timeout: 10000
- assertVisible: .*À supprimer ${output.unique}.*

# Wrong password: refused, the account stays.
- tapOn:
    id: delete-account.password
- inputText: mauvais-mot-de-passe
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: delete-account.confirm
- tapOn:
    id: delete-account.confirm
- extendedWaitUntil:
    visible:
      id: delete-account.error
    timeout: 10000
- assertVisible: ${output.t.errors.wrongCurrentPassword}

# Right password: account deleted, back to login with the message.
- tapOn:
    id: delete-account.password
- eraseText: 40
- inputText: ${MAESTRO_DEMO_PASSWORD}
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: delete-account.confirm
- tapOn:
    id: delete-account.confirm
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 20000
- assertVisible: ${output.t.auth.account.deleted}

# The old password no longer logs in.
- runFlow:
    file: ../subflows/submit-login.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${MAESTRO_DEMO_PASSWORD}
- extendedWaitUntil:
    visible:
      id: login.error
    timeout: 10000
- assertVisible: ${output.t.errors.invalidCredentials}

# The same address can create a new account, with no list.
- runFlow:
    file: ../subflows/submit-register.yaml
    env:
      NAME: E2E ${output.unique} bis
      EMAIL: ${output.email}
- extendedWaitUntil:
    visible:
      id: lists.screen
    timeout: 20000
- assertVisible:
    id: lists.empty
