# PR #15 (no spec): a link shared from Safari becomes an idea. List choice, prefilled form,
# add, then the list opens with the idea. Two cases: app already open (warm) and app closed (cold).
# iOS only: sharing goes through Safari and the iOS share sheet (see exclusions.md).
appId: app.ohyoushouldnt.mobile
name: "015 US1 — Share a link from Safari into a list"
tags:
  - 015-us1
  - ios-only
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runScript: ../scripts/unique.js
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: alex@example.test
# A second list, so that the « Ajouter à une liste » screen offers a choice.
- runFlow:
    file: ../subflows/create-list.yaml
    env:
      TITLE: Partage ${output.unique}

# Warm: the app is already running.
- runFlow:
    file: ../subflows/share-from-safari.yaml
    env:
      URL: http://localhost:3010/l/demo-list-lecture
- runFlow:
    file: ../subflows/share-pick-and-add.yaml
    env:
      URL: http://localhost:3010/l/demo-list-lecture
      NAME: Partagé à chaud ${output.unique}

# Cold: the app is closed when we share.
- stopApp
- runFlow:
    file: ../subflows/share-from-safari.yaml
    env:
      URL: http://localhost:3010/l/demo-list-lecture
- runFlow:
    file: ../subflows/share-pick-and-add.yaml
    env:
      URL: http://localhost:3010/l/demo-list-lecture
      NAME: Partagé à froid ${output.unique}
