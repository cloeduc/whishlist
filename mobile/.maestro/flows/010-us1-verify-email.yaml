# 010 US1: a new account sees the reminder and cannot create a list; it opens the received link
# (MailDev), confirms in the browser, and the app unlocks it when it comes back to the foreground.
appId: app.ohyoushouldnt.mobile
name: "010 US1 — Confirm your address after signing up"
tags:
  - 010-us1
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
- runFlow: ../subflows/register-unconfirmed.yaml

# Address not confirmed yet: reminder, and « Créer une liste » disabled with the reason.
- assertVisible:
    id: verify.banner
- assertVisible:
    id: lists.new-locked
- assertVisible:
    id: lists.new
    enabled: false

# Link received by email, confirmed on the site.
- runFlow:
    file: ../subflows/confirm-email.yaml
    env:
      TO: ${output.email}
      DONE: ${output.t.auth.confirmEmail.verified}
- extendedWaitUntil:
    notVisible:
      id: verify.banner
    timeout: 15000
- assertNotVisible:
    id: lists.new-locked
- assertVisible:
    id: lists.new
    enabled: true
