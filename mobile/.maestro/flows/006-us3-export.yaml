# 006 US3: « Télécharger mes données » opens the share sheet with the file, without error.
# The file content is checked by hand (exclusions.md).
appId: app.ohyoushouldnt.mobile
name: "006 US3 — Download your data"
tags:
  - 006-us3
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/register.yaml
- tapOn:
    id: open-account
- runFlow: ../subflows/open-account-data.yaml
- scrollUntilVisible:
    element:
      id: account.export
- tapOn:
    id: account.export
- runFlow:
    file: ../subflows/close-share-sheet.yaml
# On iOS, the tap that closes the sheet can hit the header of the card below and collapse it:
# we expand it again to check there is no error.
- runFlow:
    when:
      notVisible:
        id: account.export
    commands:
      - tapOn:
          id: account.data-toggle
- extendedWaitUntil:
    visible:
      id: account.export
    timeout: 10000
- assertNotVisible:
    id: account.export-error
