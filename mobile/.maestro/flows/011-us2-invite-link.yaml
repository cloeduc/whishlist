# 011 US2: the invite link of the demo list (fixed token of the suite's database) opens in the app.
# Without a session, login comes first, then the invitation resumes without reopening the link; « Rejoindre »
# opens the list. The link opens through the ohyoushouldnt:// scheme (research R10).
appId: app.ohyoushouldnt.mobile
name: "011 US2 — The invite link joins the list in the app"
tags:
  - 011-us2
---
- runFlow: ../subflows/launch-clean.yaml
- runScript: ../scripts/strings.generated.js
# Confirmed e2e account, which is not a member of the demo list; then logout.
- runFlow: ../subflows/register.yaml
- runFlow: ../subflows/logout.yaml

- openLink: ohyoushouldnt://invite/demo-list-invitation
- extendedWaitUntil:
    visible:
      id: invite.login
    timeout: 20000
- tapOn:
    id: invite.login
- runFlow:
    file: ../subflows/submit-login.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${MAESTRO_DEMO_PASSWORD}

# Back to the invitation after login, then « Rejoindre » opens the list.
- extendedWaitUntil:
    visible:
      id: invite.join
    timeout: 20000
- tapOn:
    id: invite.join
- extendedWaitUntil:
    visible:
      id: list.add-item
    timeout: 20000

# Reopening the link, already a member: the list opens right away.
- openLink: ohyoushouldnt://invite/demo-list-invitation
- extendedWaitUntil:
    visible:
      id: list.add-item
    timeout: 20000
- assertNotVisible:
    id: invite.join
