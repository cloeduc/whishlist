# Déploiement direct Mac Mini (port hôte → cloudflared).
services:
  whishlist:
    image: whishlist:local
    pull_policy: never
    container_name: whishlist
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8740:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SESSION_SECRET: ${WHISHLIST_SESSION_SECRET}
      WISHLIST_DATA_PATH: /data/wishlist.json
      RESEND_API_KEY: ${WHISHLIST_RESEND_API_KEY:-}
      MAIL_FROM: ${WHISHLIST_MAIL_FROM:-}
      GEMINI_API_KEY: ${WHISHLIST_GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${WHISHLIST_OPENAI_API_KEY:-}
    volumes:
      - ${WHISHLIST_DATA_DIR:-./data-prod}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
